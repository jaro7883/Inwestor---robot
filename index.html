<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Inwestycyjny</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial; margin:0; background:#111; color:#fff;}
.container { padding:20px;}
.card { background:#1e1e1e; padding:15px; border-radius:10px; margin-bottom:15px;}
button { padding:10px; border:none; border-radius:8px; background:#00c853; color:white;}
</style>
</head>
<body>
<div class="container">
<h2>🤖 Robot Inwestycyjny</h2>

<div class="card">
<h3>📊 Rekomendacja</h3>
<p id="recommendation">Ładowanie...</p>
</div>

<div class="card">
<h3>🔥 Radar okazji</h3>
<ul id="radar"></ul>
</div>

<button onclick="generate()">Odśwież</button>
</div>

<script>
function generate() {
    const assets = [
        {name:"VWCE", score:Math.random()*100},
        {name:"BTC", score:Math.random()*100},
        {name:"Złoto", score:Math.random()*100},
        {name:"Ropa", score:Math.random()*100},
        {name:"NVDA", score:Math.random()*100}
    ];

    assets.sort((a,b)=>b.score-a.score);

    document.getElementById("radar").innerHTML =
        assets.map(a=>`<li>${a.name}: ${a.score.toFixed(0)}</li>`).join("");

    document.getElementById("recommendation").innerText =
        "Kup ETF + najlepszy wynik: " + assets[0].name;
}

generate();
</script>
</body>
</html>
